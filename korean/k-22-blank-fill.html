<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>문장 빈칸 채우기</title>
    <style>
        /* [선생님 수정 포인트 1] 스타일 */
        :root {
            --bg-color: #eff6ff;
            --highlight: #3b82f6;
            --text-color: #1e3a8a;
        }

        body {
            font-family: 'Malgun Gothic', sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            user-select: none;
        }

        h1 { color: var(--text-color); margin-bottom: 30px; }

        .quiz-card {
            background: white;
            width: 100%;
            max-width: 600px;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
        }

        .sentence-display {
            font-size: 2.5rem;
            margin-bottom: 40px;
            line-height: 1.5;
            color: #333;
        }

        .blank-box {
            display: inline-block;
            width: 150px;
            height: 60px;
            border-bottom: 4px solid var(--highlight);
            vertical-align: bottom;
            color: var(--highlight);
            font-weight: bold;
            text-align: center;
            background-color: #eff6ff;
            margin: 0 10px;
            border-radius: 10px 10px 0 0;
        }
        
        .blank-box.filled {
            background-color: #dbeafe;
        }

        .options-area {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .option-btn {
            background: white;
            border: 2px solid #bfdbfe;
            padding: 20px;
            font-size: 1.8rem;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.2s;
            color: #1e40af;
            font-weight: bold;
        }

        .option-btn:hover {
            background-color: #eff6ff;
            transform: translateY(-3px);
            border-color: var(--highlight);
        }

        .option-btn.correct {
            background-color: #22c55e;
            color: white;
            border-color: #22c55e;
        }

        .option-btn.wrong {
            background-color: #ef4444;
            color: white;
            border-color: #ef4444;
            opacity: 0.6;
        }

        .next-btn {
            margin-top: 30px;
            padding: 10px 25px;
            background-color: #93c5fd;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }

    </style>
</head>
<body>

    <h1>🔤 알맞은 말은 무엇일까요? <span style="font-size:0.5em; color:#888; border:1px solid #ddd; padding:2px 5px; border-radius:5px; vertical-align:middle;">[4국어03-03] 문맥에 알맞은 낱말 넣기</span></h1>

    <div class="quiz-card">
        <div class="sentence-display" id="sentenceDisplay">
            <!-- 문장이 여기에 표시됩니다 -->
        </div>

        <div class="options-area" id="optionsArea">
            <!-- 보기가 여기에 표시됩니다 -->
        </div>
    </div>

    <button class="next-btn" onclick="nextProblem()">다음 문제 ➡️</button>

    <script>
        /* [선생님 수정 포인트 2] 문제 데이터 */
        // sentence: 문장 (빈칸은 ___ 로 표시하지만 코드에서 처리함)
        // answer: 정답 단어
        // wrong: 오답 단어
        // pre: 빈칸 앞부분, post: 빈칸 뒷부분
        const problems = [
            { pre: "하늘이", post: "습니다.", answer: "파랗", wrong: "노랗" },
            { pre: "나는 밥을", post: "먹어요.", answer: "맛있게", wrong: "슬프게" },
            { pre: "비가 와서", post: "썼어요.", answer: "우산을", wrong: "모자를" },
            { pre: "더울 때는", post: "틀어요.", answer: "선풍기를", wrong: "난로를" },
            { pre: "친구와", post: "놀아요.", answer: "사이좋게", wrong: "화나게" }
        ];

        let currentProblem = null;
        let isSolved = false;

        function initGame() {
            nextProblem();
        }

        function nextProblem() {
            isSolved = false;
            currentProblem = problems[Math.floor(Math.random() * problems.length)];

            const display = document.getElementById('sentenceDisplay');
            display.innerHTML = `
                ${currentProblem.pre} 
                <span class="blank-box" id="blankBox">?</span> 
                ${currentProblem.post}
            `;

            const optionsArea = document.getElementById('optionsArea');
            optionsArea.innerHTML = '';

            // 보기 섞기
            let choices = [currentProblem.answer, currentProblem.wrong].sort(() => Math.random() - 0.5);

            choices.forEach(word => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = word;
                btn.onclick = () => checkAnswer(btn, word);
                optionsArea.appendChild(btn);
            });
        }

        function checkAnswer(btn, selected) {
            if (isSolved) return;

            if (selected === currentProblem.answer) {
                // 정답
                isSolved = true;
                btn.classList.add('correct');
                
                // 빈칸 채우기 애니메이션
                const blank = document.getElementById('blankBox');
                blank.innerText = selected;
                blank.classList.add('filled');
                
                playSuccess();
                
                setTimeout(() => {
                    alert("정답입니다! 문장이 완성되었어요!");
                    nextProblem();
                }, 1000);
            } else {
                // 오답
                btn.classList.add('wrong');
                playWrong();
            }
        }

        function playSuccess() {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.frequency.setValueAtTime(523.25, ctx.currentTime);
            osc.frequency.setValueAtTime(659.25, ctx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.1, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
            osc.start();
            osc.stop(ctx.currentTime + 0.3);
        }

        function playWrong() {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(200, ctx.currentTime);
            gain.gain.setValueAtTime(0.1, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.2);
            osc.start();
            osc.stop(ctx.currentTime + 0.2);
        }

        initGame();
    </script>
</body>
</html>
