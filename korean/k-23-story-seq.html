<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>이야기 순서 배열</title>
    <style>
        /* [선생님 수정 포인트 1] 스타일 */
        :root {
            --bg-color: #fff7ed;
            --card-border: #fdba74;
            --highlight: #f97316;
        }

        body {
            font-family: 'Malgun Gothic', sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            user-select: none;
        }

        h1 { color: #9a3412; margin-bottom: 10px; }

        .instruction {
            margin-bottom: 30px;
            font-size: 1.2rem;
            color: #c2410c;
        }

        .slots-container {
            display: flex;
            gap: 20px;
            margin-bottom: 40px;
            width: 100%;
            max-width: 800px;
            justify-content: center;
        }

        .slot {
            width: 200px;
            height: 200px;
            border: 4px dashed var(--card-border);
            border-radius: 15px;
            background: rgba(255,255,255,0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .slot-number {
            position: absolute;
            top: -15px;
            background: var(--highlight);
            color: white;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        .card-pool {
            display: flex;
            gap: 20px;
            padding: 20px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }

        .story-card {
            width: 180px;
            height: 180px;
            background: white;
            border: 2px solid #fed7aa;
            border-radius: 10px;
            cursor: grab;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            padding: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            transition: transform 0.2s;
            touch-action: none;
        }

        .story-card:active {
            cursor: grabbing;
            transform: scale(1.05);
        }

        .card-img {
            font-size: 4rem;
            margin-bottom: 10px;
        }

        .card-text {
            text-align: center;
            word-break: keep-all;
        }

        .check-btn {
            margin-top: 30px;
            padding: 12px 30px;
            background: var(--highlight);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.2rem;
            cursor: pointer;
        }
        
        .check-btn:hover { background-color: #ea580c; }

    </style>
</head>
<body>

    <h1>📖 이야기 순서 맞추기 <span style="font-size:0.5em; color:#888; border:1px solid #ddd; padding:2px 5px; border-radius:5px; vertical-align:middle;">[2국어01-01] 일의 순서 이해하기</span></h1>
    <p class="instruction">일어난 순서대로 그림을 놓아보세요.</p>

    <div class="slots-container">
        <div class="slot" id="slot1" data-order="1">
            <div class="slot-number">1</div>
        </div>
        <div class="slot" id="slot2" data-order="2">
            <div class="slot-number">2</div>
        </div>
        <div class="slot" id="slot3" data-order="3">
            <div class="slot-number">3</div>
        </div>
    </div>

    <div class="card-pool" id="cardPool">
        <!-- 카드가 여기에 생성됨 -->
    </div>

    <button class="check-btn" onclick="checkOrder()">정답 확인 ✅</button>

    <script>
        /* [선생님 수정 포인트 2] 이야기 데이터 (3단계) */
        // order: 1, 2, 3 (정답 순서)
        // icon: 그림 대신 이모지 사용 (이미지 태그로 교체 가능)
        const storyData = [
            { order: 1, icon: "🌱", text: "씨앗을 심어요" },
            { order: 2, icon: "🌿", text: "새싹이 돋아나요" },
            { order: 3, icon: "🌻", text: "꽃이 활짝 폈어요" }
        ];

        /* 예시 2: 
        const storyData = [
            { order: 1, icon: "🌧️", text: "비가 와요" },
            { order: 2, icon: "☂️", text: "우산을 써요" },
            { order: 3, icon: "🏠", text: "집에 도착했어요" }
        ]; 
        */

        function initGame() {
            const pool = document.getElementById('cardPool');
            pool.innerHTML = '';
            
            // 슬롯 비우기
            document.querySelectorAll('.slot').forEach(s => {
                // 숫자 라벨 제외하고 비우기 (첫번째 자식은 숫자라벨)
                while(s.children.length > 1) {
                    s.removeChild(s.lastChild);
                }
            });

            // 카드 섞기
            let cards = [...storyData].sort(() => Math.random() - 0.5);

            cards.forEach(item => {
                const card = document.createElement('div');
                card.className = 'story-card';
                card.draggable = true; // 데스크탑 드래그용
                card.dataset.correctOrder = item.order;
                card.innerHTML = `
                    <div class="card-img">${item.icon}</div>
                    <div class="card-text">${item.text}</div>
                `;
                
                // 드래그 이벤트 (데스크탑)
                card.addEventListener('dragstart', dragStart);
                
                // 터치 이벤트 (모바일)
                setupTouchDrag(card);

                pool.appendChild(card);
            });

            // 드롭존 이벤트
            document.querySelectorAll('.slot').forEach(slot => {
                slot.addEventListener('dragover', dragOver);
                slot.addEventListener('drop', drop);
            });
            
            // 풀(pool)로 다시 돌아오는 기능
            pool.addEventListener('dragover', dragOver);
            pool.addEventListener('drop', returnToPool);
        }

        let draggedItem = null;

        function dragStart(e) {
            draggedItem = this;
            setTimeout(() => this.style.display = 'none', 0);
        }

        function dragOver(e) {
            e.preventDefault();
        }

        function drop(e) {
            e.preventDefault();
            if (this.children.length > 1) {
                // 이미 카드가 있으면 교체하거나 거부 (여기선 간단히 거부)
                return;
            }
            this.appendChild(draggedItem);
            draggedItem.style.display = 'flex';
            draggedItem = null;
        }
        
        function returnToPool(e) {
            e.preventDefault();
            this.appendChild(draggedItem);
            draggedItem.style.display = 'flex';
            draggedItem = null;
        }

        // 모바일 터치 드래그 구현 (간소화)
        function setupTouchDrag(el) {
            let startX, startY, initialParent;

            el.addEventListener('touchstart', function(e) {
                // e.preventDefault(); // 스크롤 방해 안되게 주의
                const touch = e.touches[0];
                startX = touch.clientX;
                startY = touch.clientY;
                initialParent = el.parentElement;
                
                el.style.position = 'fixed';
                el.style.left = (touch.clientX - el.offsetWidth/2) + 'px';
                el.style.top = (touch.clientY - el.offsetHeight/2) + 'px';
                el.style.zIndex = 1000;
            });

            el.addEventListener('touchmove', function(e) {
                e.preventDefault();
                const touch = e.touches[0];
                el.style.left = (touch.clientX - el.offsetWidth/2) + 'px';
                el.style.top = (touch.clientY - el.offsetHeight/2) + 'px';
            });

            el.addEventListener('touchend', function(e) {
                el.style.position = 'static';
                el.style.zIndex = 'auto';
                
                // 드롭 위치 확인
                const touch = e.changedTouches[0];
                const elemBelow = document.elementFromPoint(touch.clientX, touch.clientY);
                const slot = elemBelow ? elemBelow.closest('.slot') : null;
                const pool = elemBelow ? elemBelow.closest('.card-pool') : null;

                if (slot && slot.children.length <= 1) {
                    slot.appendChild(el);
                } else if (pool) {
                    pool.appendChild(el);
                } else {
                    // 원래 자리로
                    initialParent.appendChild(el);
                }
            });
        }

        function checkOrder() {
            const slots = document.querySelectorAll('.slot');
            let correct = 0;
            let filled = 0;

            slots.forEach(slot => {
                if (slot.children.length > 1) {
                    filled++;
                    const card = slot.children[1]; // 0번은 숫자라벨
                    if (parseInt(card.dataset.correctOrder) === parseInt(slot.dataset.order)) {
                        correct++;
                    }
                }
            });

            if (filled < 3) {
                alert("빈칸을 모두 채워주세요!");
                return;
            }

            if (correct === 3) {
                playSuccess();
                alert("정답입니다! 이야기가 완성되었어요! 🎉");
            } else {
                playWrong();
                alert("순서가 조금 달라요. 다시 생각해볼까요?");
            }
        }

        function playSuccess() {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.frequency.setValueAtTime(600, ctx.currentTime);
            osc.frequency.linearRampToValueAtTime(800, ctx.currentTime + 0.2);
            gain.gain.setValueAtTime(0.1, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
            osc.start();
            osc.stop(ctx.currentTime + 0.3);
        }

        function playWrong() {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(150, ctx.currentTime);
            gain.gain.setValueAtTime(0.1, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.2);
            osc.start();
            osc.stop(ctx.currentTime + 0.2);
        }

        initGame();
    </script>
</body>
</html>
