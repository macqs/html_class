<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>끼리끼리 분류하기</title>
    <style>
        /* [선생님 수정 포인트 1] 디자인 */
        :root {
            --bg-color: #f0f9ff;
            --zone-1-bg: #dbeafe;
            --zone-1-border: #3b82f6;
            --zone-2-bg: #fce7f3;
            --zone-2-border: #ec4899;
        }

        body {
            font-family: 'Malgun Gothic', sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            user-select: none;
            overflow: hidden; /* 드래그 중 스크롤 방지 */
        }

        h1 { margin-bottom: 10px; color: #1e3a8a; }

        .instruction {
            margin-bottom: 20px;
            font-size: 1.2rem;
            color: #1e40af;
        }

        .game-area {
            display: flex;
            gap: 20px;
            width: 100%;
            max-width: 800px;
            height: 400px;
        }

        .drop-zone {
            flex: 1;
            border-radius: 20px;
            border: 4px dashed;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            transition: background-color 0.3s;
            position: relative;
        }

        .zone-title {
            font-size: 2rem;
            font-weight: bold;
            margin-bottom: 20px;
            background: white;
            padding: 5px 20px;
            border-radius: 50px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        #zone1 {
            background-color: var(--zone-1-bg);
            border-color: var(--zone-1-border);
            color: var(--zone-1-border);
        }

        #zone2 {
            background-color: var(--zone-2-bg);
            border-color: var(--zone-2-border);
            color: var(--zone-2-border);
        }

        .item-container {
            width: 100%;
            height: 120px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin-top: 30px;
            background: rgba(255,255,255,0.5);
            border-radius: 20px;
            padding: 10px;
        }

        .draggable-item {
            width: 80px;
            height: 80px;
            background: white;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            cursor: grab;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            border: 2px solid #cbd5e1;
            touch-action: none; /* 모바일 터치 드래그 필수 */
        }

        .draggable-item:active {
            cursor: grabbing;
            transform: scale(1.1);
        }
        
        .draggable-item.placed {
            width: 60px;
            height: 60px;
            font-size: 2rem;
            margin: 5px;
            cursor: default;
        }

        .success-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255,255,255,0.9);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            color: #16a34a;
            font-weight: bold;
            display: none;
            z-index: 100;
        }
    </style>
</head>
<body>

    <h1>🧺 끼리끼리 모아요 <span style="font-size:0.5em; color:#888; border:1px solid #ddd; padding:2px 5px; border-radius:5px; vertical-align:middle;">[4국어04-01] 낱말 범주 분류하기</span></h1>
    <p class="instruction">아래 물건들을 알맞은 상자에 넣어주세요.</p>

    <div class="game-area">
        <!-- [선생님 수정 포인트 2] 카테고리 이름 -->
        <div class="drop-zone" id="zone1" data-category="fruit">
            <div class="zone-title">과일 🍎</div>
            <div class="placed-items" style="display:flex; flex-wrap:wrap; justify-content:center; width:100%"></div>
        </div>
        <div class="drop-zone" id="zone2" data-category="vehicle">
            <div class="zone-title">탈것 🚌</div>
            <div class="placed-items" style="display:flex; flex-wrap:wrap; justify-content:center; width:100%"></div>
        </div>
    </div>

    <div class="item-container" id="itemSource">
        <!-- 아이템들이 여기에 생성됩니다 -->
    </div>

    <div class="success-overlay" id="successMsg">
        참 잘했어요! 👏👏👏
        <button onclick="location.reload()" style="margin-top:20px; font-size:1.5rem; padding:10px 30px; cursor:pointer; border:none; background:#16a34a; color:white; border-radius:10px;">다시 하기</button>
    </div>

    <script>
        /* [선생님 수정 포인트 3] 분류할 아이템 목록 */
        // category는 위쪽 drop-zone의 data-category와 일치해야 합니다.
        const items = [
            { icon: "🍌", category: "fruit" },
            { icon: "🚗", category: "vehicle" },
            { icon: "🍇", category: "fruit" },
            { icon: "✈️", category: "vehicle" },
            { icon: "🍓", category: "fruit" },
            { icon: "🚂", category: "vehicle" }
        ];

        function initGame() {
            const source = document.getElementById('itemSource');
            // 순서 섞기
            items.sort(() => Math.random() - 0.5);

            items.forEach(item => {
                const div = document.createElement('div');
                div.className = 'draggable-item';
                div.innerText = item.icon;
                div.dataset.category = item.category;
                
                // 드래그 이벤트 연결
                setupDrag(div);
                source.appendChild(div);
            });
        }

        function setupDrag(element) {
            let startX, startY, initialLeft, initialTop;

            // 마우스 이벤트
            element.onmousedown = dragStart;
            
            // 터치 이벤트
            element.ontouchstart = dragStart;

            function dragStart(e) {
                e.preventDefault();
                const evt = e.touches ? e.touches[0] : e;
                
                startX = evt.clientX;
                startY = evt.clientY;
                
                const rect = element.getBoundingClientRect();
                
                // absolute로 변경하여 이동 준비
                element.style.position = 'fixed';
                element.style.left = rect.left + 'px';
                element.style.top = rect.top + 'px';
                element.style.zIndex = 1000;

                document.onmousemove = dragMove;
                document.onmouseup = dragEnd;
                document.ontouchmove = dragMove;
                document.ontouchend = dragEnd;
            }

            function dragMove(e) {
                const evt = e.touches ? e.touches[0] : e;
                const dx = evt.clientX - startX;
                const dy = evt.clientY - startY;
                
                // 현재 위치 + 이동량 (스타일 업데이트를 위해 매번 getBoundingClient 아님)
                // 여기선 간단히 기존 left/top 값을 파싱해서 업데이트해야 부드러움
                // 하지만 fixed로 바꿨으므로, 클라이언트 좌표 기준으로 이동시키는 게 더 정확
                
                element.style.left = evt.clientX - (element.offsetWidth / 2) + 'px';
                element.style.top = evt.clientY - (element.offsetHeight / 2) + 'px';
            }

            function dragEnd(e) {
                document.onmousemove = null;
                document.onmouseup = null;
                document.ontouchmove = null;
                document.ontouchend = null;

                element.style.zIndex = '';

                // 놓은 위치 확인
                const rect = element.getBoundingClientRect();
                const centerX = rect.left + rect.width / 2;
                const centerY = rect.top + rect.height / 2;

                // 드롭존 체크
                const zones = document.querySelectorAll('.drop-zone');
                let dropped = false;

                zones.forEach(zone => {
                    const zRect = zone.getBoundingClientRect();
                    if (centerX > zRect.left && centerX < zRect.right && 
                        centerY > zRect.top && centerY < zRect.bottom) {
                        
                        // 카테고리 일치 확인
                        if (zone.dataset.category === element.dataset.category) {
                            // 정답! 상자에 넣기
                            element.style.position = 'static';
                            element.classList.add('placed');
                            // 이벤트 제거
                            element.onmousedown = null;
                            element.ontouchstart = null;
                            
                            zone.querySelector('.placed-items').appendChild(element);
                            playPop();
                            checkCompletion();
                            dropped = true;
                        } else {
                            // 오답! 흔들림 효과 후 원위치
                            playWrong();
                        }
                    }
                });

                if (!dropped) {
                    // 원위치로 복귀 (실패 시)
                    element.style.position = 'static';
                }
            }
        }

        function checkCompletion() {
            const placedCount = document.querySelectorAll('.placed').length;
            if (placedCount === items.length) {
                playSuccess();
                setTimeout(() => {
                    document.getElementById('successMsg').style.display = 'flex';
                }, 500);
            }
        }

        function playPop() {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.frequency.setValueAtTime(600, ctx.currentTime);
            gain.gain.setValueAtTime(0.1, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.1);
            osc.start();
            osc.stop(ctx.currentTime + 0.1);
        }

        function playWrong() {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(150, ctx.currentTime);
            gain.gain.setValueAtTime(0.1, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.2);
            osc.start();
            osc.stop(ctx.currentTime + 0.2);
        }

        function playSuccess() {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.frequency.setValueAtTime(523.25, ctx.currentTime);
            osc.frequency.setValueAtTime(659.25, ctx.currentTime + 0.1);
            osc.frequency.setValueAtTime(783.99, ctx.currentTime + 0.2);
            gain.gain.setValueAtTime(0.1, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.5);
            osc.start();
            osc.stop(ctx.currentTime + 0.5);
        }

        initGame();
    </script>
</body>
</html>
