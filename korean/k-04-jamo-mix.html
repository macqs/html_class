<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>자모음 합체 놀이</title>
    <style>
        /* [선생님 수정 포인트 1] 색상 테마 */
        :root {
            --bg-color: #fff1f2;        /* 배경색 (연한 핑크) */
            --jaeum-bg: #fb7185;        /* 자음 카드 색 */
            --moeum-bg: #60a5fa;        /* 모음 카드 색 */
            --result-bg: #ffffff;       /* 결과창 배경 */
            --text-color: #881337;      /* 글자색 */
        }

        body {
            font-family: 'Malgun Gothic', sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            user-select: none;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        h1 {
            color: var(--text-color);
            margin: 0;
        }

        .game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            width: 100%;
            max-width: 800px;
        }

        .section {
            background: rgba(255, 255, 255, 0.5);
            padding: 15px;
            border-radius: 15px;
            width: 100%;
            text-align: center;
        }

        h2 {
            margin: 0 0 10px 0;
            font-size: 1.2rem;
            color: #4b5563;
        }

        .card-container {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .card {
            width: 60px;
            height: 80px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            font-weight: bold;
            color: white;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: transform 0.2s;
            border: 3px solid transparent;
        }

        .card:active {
            transform: scale(0.95);
        }

        .card.jaeum { background-color: var(--jaeum-bg); }
        .card.moeum { background-color: var(--moeum-bg); }
        
        .card.selected {
            border-color: #fcd34d; /* 선택 시 노란 테두리 */
            transform: translateY(-5px);
            box-shadow: 0 10px 15px rgba(0,0,0,0.2);
        }

        .combine-area {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin: 20px 0;
        }

        .slot {
            width: 80px;
            height: 100px;
            border: 3px dashed #ccc;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            background: white;
            color: #ccc;
        }

        .slot.filled {
            border-style: solid;
            color: white;
        }
        .slot.jaeum.filled { background-color: var(--jaeum-bg); border-color: var(--jaeum-bg); }
        .slot.moeum.filled { background-color: var(--moeum-bg); border-color: var(--moeum-bg); }

        .plus { font-size: 2rem; color: #666; }
        .equal { font-size: 2rem; color: #666; }

        .result-box {
            width: 120px;
            height: 120px;
            background-color: var(--result-bg);
            border: 4px solid #10b981;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4rem;
            font-weight: bold;
            color: #10b981;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            transition: all 0.3s;
        }
        
        .result-box.empty {
            border-color: #e5e7eb;
            color: transparent;
            box-shadow: none;
        }

        .controls {
            margin-top: 20px;
        }

        button {
            padding: 10px 20px;
            font-size: 1.2rem;
            border: none;
            border-radius: 8px;
            background-color: #6b7280;
            color: white;
            cursor: pointer;
        }
        
        button.primary {
            background-color: #db2777;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>✨ 자음 모음 합체! <span style="font-size:0.5em; color:#888; border:1px solid #ddd; padding:2px 5px; border-radius:5px; vertical-align:middle;">[2국어01-03] 자모음 결합 원리</span></h1>
        <p>자음과 모음을 합쳐서 글자를 만들어보세요.</p>
    </div>

    <div class="game-container">
        
        <!-- 자음 목록 -->
        <div class="section">
            <h2>자음 (첫소리)</h2>
            <div class="card-container" id="jaeumList">
                <!-- 자음 카드들이 여기에 들어갑니다 -->
            </div>
        </div>

        <!-- 합체 영역 -->
        <div class="combine-area">
            <div class="slot jaeum" id="slotJaeum">ㄱ</div>
            <div class="plus">+</div>
            <div class="slot moeum" id="slotMoeum">ㅏ</div>
            <div class="equal">=</div>
            <div class="result-box empty" id="resultBox">?</div>
        </div>

        <!-- 모음 목록 -->
        <div class="section">
            <h2>모음 (가운데소리)</h2>
            <div class="card-container" id="moeumList">
                <!-- 모음 카드들이 여기에 들어갑니다 -->
            </div>
        </div>

        <div class="controls">
            <button class="primary" onclick="combine()">합체하기! 🔨</button>
            <button onclick="reset()">다시하기 🔄</button>
        </div>
    </div>

    <script>
        /* [선생님 수정 포인트 2] 사용할 자음과 모음 목록 */
        const jaeums = ['ㄱ', 'ㄴ', 'ㄷ', 'ㄹ', 'ㅁ', 'ㅂ', 'ㅅ', 'ㅇ', 'ㅈ', 'ㅎ'];
        const moeums = ['ㅏ', 'ㅑ', 'ㅓ', 'ㅕ', 'ㅗ', 'ㅛ', 'ㅜ', 'ㅠ', 'ㅡ', 'ㅣ'];

        let selectedJaeum = null;
        let selectedMoeum = null;

        function init() {
            // 자음 카드 생성
            const jaeumContainer = document.getElementById('jaeumList');
            jaeumContainer.innerHTML = '';
            jaeums.forEach(char => {
                const card = createCard(char, 'jaeum');
                card.onclick = () => selectCard(char, 'jaeum', card);
                jaeumContainer.appendChild(card);
            });

            // 모음 카드 생성
            const moeumContainer = document.getElementById('moeumList');
            moeumContainer.innerHTML = '';
            moeums.forEach(char => {
                const card = createCard(char, 'moeum');
                card.onclick = () => selectCard(char, 'moeum', card);
                moeumContainer.appendChild(card);
            });
            
            reset();
        }

        function createCard(char, type) {
            const div = document.createElement('div');
            div.className = `card ${type}`;
            div.innerText = char;
            return div;
        }

        function selectCard(char, type, element) {
            // 이전 선택 해제
            document.querySelectorAll(`.card.${type}`).forEach(c => c.classList.remove('selected'));
            element.classList.add('selected');

            // 슬롯 업데이트
            if (type === 'jaeum') {
                selectedJaeum = char;
                updateSlot('slotJaeum', char, 'jaeum');
            } else {
                selectedMoeum = char;
                updateSlot('slotMoeum', char, 'moeum');
            }
            
            // 결과창 초기화 (새로 선택했으므로)
            document.getElementById('resultBox').classList.add('empty');
            document.getElementById('resultBox').innerText = "?";
        }

        function updateSlot(id, char, type) {
            const slot = document.getElementById(id);
            slot.innerText = char;
            slot.classList.add('filled');
        }

        function combine() {
            if (!selectedJaeum || !selectedMoeum) {
                alert("자음과 모음을 모두 선택해주세요!");
                return;
            }

            // 한글 합치기 (Hangul.assemble 같은 라이브러리 없이 간단히 구현)
            // 여기서는 초성+중성 결합 규칙을 유니코드 공식을 이용해 구현합니다.
            // 공식: (초성인덱스 * 588) + (중성인덱스 * 28) + (종성인덱스) + 0xAC00
            
            const chosung = ["ㄱ","ㄲ","ㄴ","ㄷ","ㄸ","ㄹ","ㅁ","ㅂ","ㅃ","ㅅ","ㅆ","ㅇ","ㅈ","ㅉ","ㅊ","ㅋ","ㅌ","ㅍ","ㅎ"];
            const jungsung = ["ㅏ","ㅐ","ㅑ","ㅒ","ㅓ","ㅔ","ㅕ","ㅖ","ㅗ","ㅘ","ㅙ","ㅚ","ㅛ","ㅜ","ㅝ","ㅞ","ㅟ","ㅠ","ㅡ","ㅢ","ㅣ"];
            
            const choIndex = chosung.indexOf(selectedJaeum);
            const jungIndex = jungsung.indexOf(selectedMoeum);

            if (choIndex === -1 || jungIndex === -1) {
                // 목록에 없는 복잡한 자모음일 경우 그냥 텍스트 결합으로 보여줌 (예외처리)
                showResult(selectedJaeum + selectedMoeum);
                return;
            }

            const unicodeVal = 0xAC00 + (choIndex * 588) + (jungIndex * 28); // 종성은 없음(0)
            const resultChar = String.fromCharCode(unicodeVal);

            showResult(resultChar);
        }

        function showResult(char) {
            const box = document.getElementById('resultBox');
            box.innerText = char;
            box.classList.remove('empty');
            
            // 효과음
            playPop();
            
            // 애니메이션 효과
            box.style.transform = "scale(1.2)";
            setTimeout(() => box.style.transform = "scale(1)", 300);
        }
        
        function playPop() {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.frequency.setValueAtTime(600, ctx.currentTime);
            gain.gain.setValueAtTime(0.1, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.1);
            osc.start();
            osc.stop(ctx.currentTime + 0.1);
        }

        function reset() {
            selectedJaeum = null;
            selectedMoeum = null;
            
            document.getElementById('slotJaeum').innerText = "ㄱ";
            document.getElementById('slotJaeum').classList.remove('filled');
            
            document.getElementById('slotMoeum').innerText = "ㅏ";
            document.getElementById('slotMoeum').classList.remove('filled');
            
            document.getElementById('resultBox').innerText = "?";
            document.getElementById('resultBox').classList.add('empty');
            
            document.querySelectorAll('.card').forEach(c => c.classList.remove('selected'));
        }

        init();
    </script>
</body>
</html>
