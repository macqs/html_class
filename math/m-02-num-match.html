<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>숫자-개수 짝짓기</title>
    <style>
        /* [선생님 수정 포인트 1] 색상 테마 */
        :root {
            --bg-color: #fffbe6;        /* 배경색 (연한 노랑) */
            --item-bg: #ffffff;         /* 카드 배경 */
            --line-color: #f59e0b;      /* 선 색상 (진한 노랑/주황) */
            --text-color: #78350f;      /* 글자색 (갈색) */
        }

        body {
            font-family: 'Malgun Gothic', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            user-select: none;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 2rem;
            margin: 0;
        }

        .game-area {
            position: relative;
            display: flex;
            justify-content: space-between;
            width: 100%;
            max-width: 700px;
            padding: 20px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
        }

        .column {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 40%;
            z-index: 2;
        }

        .item {
            background-color: var(--item-bg);
            border: 3px solid #e5e7eb;
            border-radius: 15px;
            min-height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 2rem;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            position: relative;
        }

        .item:hover {
            border-color: #fbbf24;
            transform: scale(1.02);
        }

        .item.selected {
            border-color: var(--line-color);
            background-color: #fff7ed;
            box-shadow: 0 0 0 4px rgba(245, 158, 11, 0.3);
        }

        .item.matched {
            border-color: #22c55e;
            background-color: #f0fdf4;
            opacity: 0.6;
            pointer-events: none;
        }
        
        /* 숫자 카드 스타일 */
        .item.number {
            font-size: 4rem;
            color: var(--line-color);
        }

        /* 개수(그림) 카드 스타일 */
        .item.objects {
            flex-wrap: wrap;
            padding: 10px;
            gap: 5px;
            align-content: center;
        }

        .obj-icon {
            font-size: 2rem;
        }

        #svg-layer {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        line {
            stroke-width: 5;
            stroke-linecap: round;
            opacity: 0.6;
        }

        .controls {
            margin-top: 20px;
        }

        button {
            background-color: var(--line-color);
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 1.2rem;
            border-radius: 10px;
            cursor: pointer;
        }

        button:hover {
            background-color: #d97706;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>1️⃣2️⃣3️⃣<h1>🧩 숫자와 개수 짝짓기 <span style="font-size:0.5em; color:#888; border:1px solid #ddd; padding:2px 5px; border-radius:5px; vertical-align:middle;">[2수학01-04] 수와 양의 관계</span></h1>
        <p>숫자에 맞는 개수 그림을 찾아 연결해주세요.</p>
    </div>

    <div class="game-area">
        <svg id="svg-layer"></svg>
        
        <div class="column" id="col-numbers">
            <!-- 숫자가 여기에 들어갑니다 -->
        </div>
        
        <div class="column" id="col-objects">
            <!-- 개수 그림이 여기에 들어갑니다 -->
        </div>
    </div>

    <div class="controls">
        <button onclick="resetGame()">다시 하기 🔄</button>
    </div>

    <script>
        /* [선생님 수정 포인트 2] 문제 데이터 설정 */
        // 1부터 5까지의 숫자 중에서 3개를 랜덤으로 골라 문제를 냅니다.
        const maxNumber = 5; 
        const problemCount = 3;
        const emoji = "🍎"; // 개수를 셀 물건 (사과)

        let selectedNumber = null;
        let matchedCount = 0;
        let pairs = [];

        function initGame() {
            const colNum = document.getElementById('col-numbers');
            const colObj = document.getElementById('col-objects');
            const svg = document.getElementById('svg-layer');
            
            colNum.innerHTML = '';
            colObj.innerHTML = '';
            svg.innerHTML = '';
            matchedCount = 0;
            selectedNumber = null;
            pairs = [];

            // 1~maxNumber 중 problemCount개 랜덤 선택
            let nums = [];
            for(let i=1; i<=maxNumber; i++) nums.push(i);
            nums.sort(() => Math.random() - 0.5);
            const targetNums = nums.slice(0, problemCount);

            // 데이터 생성
            targetNums.forEach(n => {
                pairs.push({
                    num: n,
                    id: `pair-${n}`
                });
            });

            // 숫자 컬럼 생성 (랜덤 순서)
            let shuffledNums = [...pairs].sort(() => Math.random() - 0.5);
            shuffledNums.forEach(p => {
                const el = document.createElement('div');
                el.className = 'item number';
                el.innerText = p.num;
                el.dataset.id = p.id;
                el.dataset.type = 'number';
                el.onclick = handleClick;
                colNum.appendChild(el);
            });

            // 개수 컬럼 생성 (랜덤 순서)
            let shuffledObjs = [...pairs].sort(() => Math.random() - 0.5);
            shuffledObjs.forEach(p => {
                const el = document.createElement('div');
                el.className = 'item objects';
                el.dataset.id = p.id;
                el.dataset.type = 'object';
                
                // 개수만큼 이모지 넣기
                for(let i=0; i<p.num; i++) {
                    const span = document.createElement('span');
                    span.className = 'obj-icon';
                    span.innerText = emoji;
                    el.appendChild(span);
                }
                
                el.onclick = handleClick;
                colObj.appendChild(el);
            });
        }

        function handleClick(e) {
            const el = e.currentTarget;
            if(el.classList.contains('matched')) return;

            // 같은 열을 또 클릭했는지 확인 (선택 변경)
            const type = el.dataset.type;
            
            // 이미 선택된 것 처리
            const prevSelected = document.querySelector(`.item.selected[data-type="${type}"]`);
            if(prevSelected) prevSelected.classList.remove('selected');

            el.classList.add('selected');

            // 양쪽 다 선택되었는지 확인
            const selNum = document.querySelector('.item.selected[data-type="number"]');
            const selObj = document.querySelector('.item.selected[data-type="object"]');

            if(selNum && selObj) {
                checkMatch(selNum, selObj);
            }
        }

        function checkMatch(el1, el2) {
            if(el1.dataset.id === el2.dataset.id) {
                // 정답
                el1.classList.remove('selected');
                el2.classList.remove('selected');
                el1.classList.add('matched');
                el2.classList.add('matched');
                
                drawLine(el1, el2, "#22c55e");
                playSuccess();
                matchedCount++;

                if(matchedCount === problemCount) {
                    setTimeout(() => alert("참 잘했어요! 짝꿍을 모두 찾았네요! 🎉"), 500);
                }
            } else {
                // 오답
                el1.classList.remove('selected');
                el2.classList.remove('selected');
                
                // 흔들림 효과
                el1.style.borderColor = '#ef4444';
                el2.style.borderColor = '#ef4444';
                playWrong();
                
                setTimeout(() => {
                    el1.style.borderColor = '';
                    el2.style.borderColor = '';
                }, 500);
            }
        }

        function drawLine(el1, el2, color) {
            const svg = document.getElementById('svg-layer');
            const r1 = el1.getBoundingClientRect();
            const r2 = el2.getBoundingClientRect();
            const c = document.querySelector('.game-area').getBoundingClientRect();

            const x1 = r1.right - c.left; // 숫자 오른쪽 끝
            const y1 = r1.top + r1.height/2 - c.top;
            const x2 = r2.left - c.left;  // 그림 왼쪽 끝
            const y2 = r2.top + r2.height/2 - c.top;

            const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
            line.setAttribute("x1", x1);
            line.setAttribute("y1", y1);
            line.setAttribute("x2", x2);
            line.setAttribute("y2", y2);
            line.setAttribute("stroke", color);
            
            svg.appendChild(line);
        }
        
        function playSuccess() {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.frequency.setValueAtTime(523.25, ctx.currentTime);
            osc.frequency.setValueAtTime(659.25, ctx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.1, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
            osc.start();
            osc.stop(ctx.currentTime + 0.3);
        }
        
        function playWrong() {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(100, ctx.currentTime);
            gain.gain.setValueAtTime(0.1, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.2);
            osc.start();
            osc.stop(ctx.currentTime + 0.2);
        }

        function resetGame() {
            initGame();
        }

        initGame();
    </script>
</body>
</html>
