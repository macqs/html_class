<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>색깔 분류하기</title>
    <style>
        /* [선생님 수정 포인트 1] 스타일 */
        :root {
            --bg-color: #fef2f2;
        }

        body {
            font-family: 'Malgun Gothic', sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            user-select: none;
            overflow: hidden;
        }

        h1 { color: #7f1d1d; margin-bottom: 20px; }

        .baskets-area {
            display: flex;
            gap: 30px;
            justify-content: center;
            width: 100%;
            max-width: 800px;
            margin-bottom: 50px;
        }

        .basket {
            width: 200px;
            height: 250px;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            padding: 20px;
            border: 5px solid rgba(0,0,0,0.1);
            position: relative;
            transition: transform 0.2s;
        }

        .basket-label {
            font-size: 1.5rem;
            font-weight: bold;
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            margin-top: 10px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.2);
        }

        /* 색상별 바구니 스타일 */
        .basket.red { background-color: #fee2e2; border-color: #ef4444; }
        .basket.red .basket-label { background-color: #ef4444; }
        
        .basket.blue { background-color: #dbeafe; border-color: #3b82f6; }
        .basket.blue .basket-label { background-color: #3b82f6; }

        .basket.highlight { transform: scale(1.1); }

        .item-source {
            width: 100%;
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
            padding: 20px;
            background: rgba(255,255,255,0.5);
            border-radius: 20px;
        }

        .color-item {
            width: 80px;
            height: 80px;
            cursor: grab;
            font-size: 3.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s;
            touch-action: none;
        }
        
        .color-item:active {
            cursor: grabbing;
            transform: scale(1.2);
        }

        .color-item.placed {
            width: 50px;
            height: 50px;
            font-size: 2.5rem;
            cursor: default;
            margin: 2px;
        }

        .basket-contents {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            width: 100%;
            height: 100%;
            align-content: flex-start;
        }

    </style>
</head>
<body>

    <h1>🎨 색깔끼리 모아요 (빨강 vs 파랑) <span style="font-size:0.5em; color:#888; border:1px solid #ddd; padding:2px 5px; border-radius:5px; vertical-align:middle;">[2수학04-01] 기준에 따라 분류하기</span></h1>
    <p style="color:#666; margin-bottom:20px;">물건의 색깔을 보고 알맞은 바구니에 넣어주세요.</p>

    <div class="baskets-area">
        <div class="basket red" data-color="red">
            <div class="basket-contents"></div>
            <div class="basket-label">빨강</div>
        </div>
        <div class="basket blue" data-color="blue">
            <div class="basket-contents"></div>
            <div class="basket-label">파랑</div>
        </div>
    </div>

    <div class="item-source" id="source">
        <!-- 아이템 생성 -->
    </div>

    <script>
        /* [선생님 수정 포인트 2] 색깔별 아이템 목록 */
        // 빨강, 파랑 외에 노랑, 초록 등을 추가하려면 위쪽 CSS .basket.yellow 등을 만들고 여기 데이터 추가하면 됩니다.
        const items = [
            { icon: "🍎", color: "red" },
            { icon: "🍓", color: "red" },
            { icon: "🌹", color: "red" },
            { icon: "🦀", color: "red" },
            { icon: "🚙", color: "blue" },
            { icon: "👖", color: "blue" },
            { icon: "🧢", color: "blue" },
            { icon: "🐳", color: "blue" },
            { icon: "🫐", color: "blue" } // 블루베리
        ];

        function initGame() {
            const source = document.getElementById('source');
            items.sort(() => Math.random() - 0.5);

            items.forEach(item => {
                const el = document.createElement('div');
                el.className = 'color-item';
                el.innerText = item.icon;
                el.dataset.color = item.color;
                
                setupDrag(el);
                source.appendChild(el);
            });
        }

        function setupDrag(el) {
            let startX, startY;
            
            el.addEventListener('mousedown', start);
            el.addEventListener('touchstart', start, {passive: false});

            function start(e) {
                e.preventDefault();
                const evt = e.touches ? e.touches[0] : e;
                
                const rect = el.getBoundingClientRect();
                el.style.position = 'fixed';
                el.style.left = rect.left + 'px';
                el.style.top = rect.top + 'px';
                el.style.zIndex = 1000;

                document.addEventListener('mousemove', move);
                document.addEventListener('mouseup', end);
                document.addEventListener('touchmove', move, {passive: false});
                document.addEventListener('touchend', end);
            }

            function move(e) {
                e.preventDefault();
                const evt = e.touches ? e.touches[0] : e;
                el.style.left = (evt.clientX - el.offsetWidth/2) + 'px';
                el.style.top = (evt.clientY - el.offsetHeight/2) + 'px';
            }

            function end(e) {
                document.removeEventListener('mousemove', move);
                document.removeEventListener('mouseup', end);
                document.removeEventListener('touchmove', move);
                document.removeEventListener('touchend', end);

                // 드롭 확인
                const rect = el.getBoundingClientRect();
                const cx = rect.left + rect.width/2;
                const cy = rect.top + rect.height/2;

                let dropped = false;
                document.querySelectorAll('.basket').forEach(basket => {
                    const bRect = basket.getBoundingClientRect();
                    if(cx > bRect.left && cx < bRect.right && cy > bRect.top && cy < bRect.bottom) {
                        
                        if(basket.dataset.color === el.dataset.color) {
                            // 정답
                            dropped = true;
                            el.style.position = 'static';
                            el.style.zIndex = 'auto';
                            el.classList.add('placed');
                            
                            // 이벤트 제거
                            el.removeEventListener('mousedown', start);
                            el.removeEventListener('touchstart', start);
                            
                            basket.querySelector('.basket-contents').appendChild(el);
                            
                            playSuccess();
                            basket.classList.add('highlight');
                            setTimeout(() => basket.classList.remove('highlight'), 200);
                            
                            checkWin();
                        } else {
                            playWrong();
                        }
                    }
                });

                if(!dropped) {
                    el.style.position = 'static';
                    el.style.zIndex = 'auto';
                    document.getElementById('source').appendChild(el);
                }
            }
        }

        function checkWin() {
            if(document.getElementById('source').children.length === 0) {
                setTimeout(() => alert("와우! 색깔별로 완벽하게 정리했네요! 🌈"), 500);
            }
        }

        function playSuccess() {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.frequency.setValueAtTime(800, ctx.currentTime);
            gain.gain.setValueAtTime(0.05, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.1);
            osc.start();
            osc.stop(ctx.currentTime + 0.1);
        }

        function playWrong() {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(150, ctx.currentTime);
            gain.gain.setValueAtTime(0.1, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.2);
            osc.start();
            osc.stop(ctx.currentTime + 0.2);
        }

        initGame();
    </script>
</body>
</html>
