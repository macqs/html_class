<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>스티커 그래프</title>
    <style>
        /* [선생님 수정 포인트 1] 스타일 */
        :root {
            --bg-color: #f0fdfa;
            --bar-bg: #ccfbf1;
            --text-color: #115e59;
        }

        body {
            font-family: 'Malgun Gothic', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            user-select: none;
        }

        h1 { margin-bottom: 10px; }

        .survey-area {
            background: white;
            padding: 20px;
            border-radius: 20px;
            margin-bottom: 30px;
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 600px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        .survey-item {
            font-size: 3rem;
            padding: 10px;
            background: #f5f5f4;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.1s;
        }
        
        .survey-item:active { transform: scale(0.9); }
        .survey-item.counted { opacity: 0.3; pointer-events: none; filter: grayscale(100%); }

        .graph-container {
            display: flex;
            align-items: flex-end;
            gap: 30px;
            height: 400px;
            padding-bottom: 20px;
            border-bottom: 3px solid #555;
        }

        .graph-bar-col {
            display: flex;
            flex-direction: column-reverse; /* 아래에서 위로 쌓이게 */
            align-items: center;
            width: 80px;
            height: 100%;
        }

        .sticker-slot {
            width: 60px;
            height: 60px;
            border: 2px dashed #99f6e4;
            margin-bottom: 5px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            background-color: white;
            transition: all 0.3s;
        }
        
        .sticker-slot.filled {
            border-style: solid;
            background-color: #fff;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            animation: popIn 0.3s;
        }

        .x-axis-label {
            margin-top: 10px;
            font-size: 2.5rem;
            text-align: center;
        }

        .count-display {
            font-size: 1.5rem;
            font-weight: bold;
            margin-top: 5px;
            color: #0f766e;
        }

        @keyframes popIn {
            0% { transform: scale(0); }
            80% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }

        .reset-btn {
            margin-top: 40px;
            padding: 10px 20px;
            background: #0d9488;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.2rem;
            cursor: pointer;
        }

    </style>
</head>
<body>

    <h1>📊 과일 스티커 그래프 <span style="font-size:0.5em; color:#888; border:1px solid #ddd; padding:2px 5px; border-radius:5px; vertical-align:middle;">[6수학04-01] 자료 분류 및 그래프</span></h1>
    <p style="margin-bottom:20px;">위의 과일을 클릭해서 그래프에 스티커를 붙여보세요.</p>

    <div class="survey-area" id="surveyZone">
        <!-- 조사 대상 과일들이 여기에 나열됨 -->
    </div>

    <div class="graph-container" id="graphZone">
        <!-- 그래프 막대들이 여기에 생성됨 -->
    </div>

    <button class="reset-btn" onclick="initGame()">다시 하기 🔄</button>

    <script>
        /* [선생님 수정 포인트 2] 그래프 데이터 설정 */
        // type: 과일 종류, count: 화면에 뿌려질 개수 (랜덤 범위 내에서)
        const categories = [
            { icon: "🍎", label: "사과" },
            { icon: "🍌", label: "바나나" },
            { icon: "🍇", label: "포도" }
        ];
        
        const maxCount = 5; // 최대 높이

        let currentCounts = {}; // 현재 붙인 개수

        function initGame() {
            // 데이터 초기화
            const surveyZone = document.getElementById('surveyZone');
            const graphZone = document.getElementById('graphZone');
            
            surveyZone.innerHTML = '';
            graphZone.innerHTML = '';
            currentCounts = {};

            // 1. 그래프 틀 만들기
            categories.forEach(cat => {
                currentCounts[cat.label] = 0;

                const col = document.createElement('div');
                col.className = 'graph-bar-col';
                
                // 스티커 슬롯 생성
                for(let i=0; i<maxCount; i++) {
                    const slot = document.createElement('div');
                    slot.className = 'sticker-slot';
                    slot.dataset.category = cat.label;
                    slot.dataset.index = i + 1; // 1층부터 5층
                    col.appendChild(slot);
                }

                // X축 라벨
                const label = document.createElement('div');
                label.className = 'x-axis-label';
                label.innerText = cat.icon;
                
                const countText = document.createElement('div');
                countText.className = 'count-display';
                countText.id = `count-${cat.label}`;
                countText.innerText = "0개";

                // 구조 조립 (그래프 아래에 라벨 붙이기 위해 별도 컨테이너 필요하지만 간단히 처리)
                // 여기서는 col 안에 슬롯만 넣고, 라벨은 col 아래에 별도로 붙이는 구조가 아니라
                // CSS flex-direction: column-reverse를 쓰고 있으므로 라벨을 맨 나중에 추가하면 맨 위에 뜸.
                // 따라서 라벨용 div를 graphZone에 직접 넣는 게 아니라 col을 감싸는 wrapper가 필요함.
                
                const wrapper = document.createElement('div');
                wrapper.style.display = 'flex';
                wrapper.style.flexDirection = 'column';
                wrapper.style.alignItems = 'center';
                
                wrapper.appendChild(col);
                wrapper.appendChild(label);
                wrapper.appendChild(countText);

                graphZone.appendChild(wrapper);
            });


            // 2. 조사 대상 아이템 뿌리기 (랜덤 개수)
            let allItems = [];
            categories.forEach(cat => {
                // 1 ~ maxCount 사이 랜덤 개수
                const count = Math.floor(Math.random() * maxCount) + 1;
                for(let i=0; i<count; i++) {
                    allItems.push({ icon: cat.icon, label: cat.label });
                }
            });

            // 섞기
            allItems.sort(() => Math.random() - 0.5);

            allItems.forEach(item => {
                const div = document.createElement('div');
                div.className = 'survey-item';
                div.innerText = item.icon;
                div.onclick = () => handleItemClick(div, item);
                surveyZone.appendChild(div);
            });
        }

        function handleItemClick(element, item) {
            if(element.classList.contains('counted')) return;

            // 해당 카테고리의 현재 카운트 증가
            const current = currentCounts[item.label];
            if(current >= maxCount) return; // 꽉 참

            // 그래프 채우기
            // flex-reverse라서 위쪽(DOM상 뒤쪽)이 1층이 아님.
            // DOM 순서: 5층, 4층, ... 1층. (flex-direction: column-reverse 때문)
            // 아, 위 코드에서 appendChild로 넣었으므로 index 0이 맨 아래(1층)가 됨.
            // 확인: slot 생성 루프 0..maxCount -> appendChild.
            // CSS reverse면 마지막 자식이 맨 위? 아니면 첫 자식이 맨 아래?
            // column-reverse: 첫 번째 자식이 맨 아래.
            // 따라서 i=0 (index 1)을 첫 자식으로 넣었으니 맨 아래가 맞음.
            
            // 슬롯 찾기 (현재 개수만큼 건너뛰고 그 다음 슬롯)
            // DOM 구조상 categories 루프 안에서 col 생성 시 slot들을 순서대로 넣음.
            // wrapper -> col -> slot(0), slot(1)...
            // column-reverse이므로 slot(0)이 맨 아래.
            // 그러므로 col.children[current] 가 대상임.

            // wrapper 찾기
            // graphZone의 자식들 중 해당 카테고리 wrapper 찾기
            // 간단히하기 위해 전역 변수나 id로 찾는 게 나음.
            // 여기선 dataset 이용
            const slots = document.querySelectorAll(`.sticker-slot[data-category="${item.label}"]`);
            // querySelectorAll은 문서 순서대로 반환.
            // 생성 순서: slot(0)..slot(4).
            // 따라서 slots[current]가 맞음.

            const targetSlot = slots[current];
            
            if(targetSlot) {
                targetSlot.innerText = item.icon;
                targetSlot.classList.add('filled');
                playPop();
                
                currentCounts[item.label]++;
                document.getElementById(`count-${item.label}`).innerText = currentCounts[item.label] + "개";
                
                // 아이템 처리 (흐리게)
                element.classList.add('counted');
                
                checkAllCounted();
            }
        }

        function checkAllCounted() {
            const remaining = document.querySelectorAll('.survey-item:not(.counted)').length;
            if(remaining === 0) {
                setTimeout(() => alert("조사가 끝났습니다! 그래프가 완성되었네요! 📈"), 500);
            }
        }
        
        function playPop() {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.frequency.setValueAtTime(600, ctx.currentTime);
            gain.gain.setValueAtTime(0.1, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.1);
            osc.start();
            osc.stop(ctx.currentTime + 0.1);
        }

        initGame();
    </script>
</body>
</html>
