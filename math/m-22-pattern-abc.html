<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ABC 패턴 채우기</title>
    <style>
        /* [선생님 수정 포인트 1] 스타일 */
        :root {
            --bg-color: #ecfccb;
            --box-border: #84cc16;
            --highlight: #4d7c0f;
        }

        body {
            font-family: 'Malgun Gothic', sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            user-select: none;
        }

        h1 { color: #365314; margin-bottom: 20px; }

        .pattern-container {
            display: flex;
            gap: 10px;
            background: white;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            margin-bottom: 40px;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 800px;
        }

        .pattern-item {
            width: 70px;
            height: 70px;
            border: 3px solid #bef264;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            background-color: #fff;
        }

        .pattern-item.empty {
            background-color: #f7fee7;
            border-style: dashed;
            border-color: var(--highlight);
            color: var(--highlight);
            font-size: 2rem;
            cursor: pointer;
        }
        
        .pattern-item.filled {
            background-color: #dcfce7;
            border-color: #22c55e;
        }

        .options-area {
            display: flex;
            gap: 20px;
            justify-content: center;
        }

        .option-btn {
            width: 90px;
            height: 90px;
            background: white;
            border: 4px solid var(--box-border);
            border-radius: 20px;
            font-size: 3rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .option-btn:hover {
            transform: translateY(-5px);
            background-color: #ecfccb;
        }

        .option-btn.wrong {
            animation: shake 0.4s;
            border-color: #ef4444;
            background-color: #fee2e2;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }
    </style>
</head>
<body>

    <h1>🚥 세 가지 규칙 (ABC 패턴) <span style="font-size:0.5em; color:#888; border:1px solid #ddd; padding:2px 5px; border-radius:5px; vertical-align:middle;">[2수학04-01] 규칙 찾기 (ABC)</span></h1>
    <p style="color:#666; margin-bottom:20px;">순서를 잘 보고 빈칸을 채워주세요.</p>

    <div class="pattern-container" id="patternRow">
        <!-- 패턴 아이템 생성 -->
    </div>

    <div class="options-area" id="options">
        <!-- 보기 생성 -->
    </div>

    <button onclick="initGame()" style="margin-top:40px; padding:10px 20px; background:#65a30d; color:white; border:none; border-radius:10px; cursor:pointer;">다음 문제 ➡️</button>

    <script>
        /* [선생님 수정 포인트 2] ABC 패턴 아이템 셋 */
        const sets = [
            { A: "🔴", B: "🟡", C: "🔵" }, // 신호등 색
            { A: "🍎", B: "🍐", C: "🍇" }, // 과일
            { A: "🐶", B: "🐱", C: "🐭" }, // 동물
            { A: "👊", B: "✌️", C: "🖐️" }  // 가위바위보
        ];

        let currentSet = null;
        let missingIndex = -1;
        let correctAnswer = "";

        function initGame() {
            const row = document.getElementById('patternRow');
            const opts = document.getElementById('options');
            row.innerHTML = '';
            opts.innerHTML = '';

            currentSet = sets[Math.floor(Math.random() * sets.length)];
            
            // 패턴 길이 (9개: ABC ABC ABC)
            const length = 9; 
            
            // 패턴 생성
            let pattern = [];
            for(let i=0; i<length; i++) {
                const mod = i % 3;
                if (mod === 0) pattern.push(currentSet.A);
                else if (mod === 1) pattern.push(currentSet.B);
                else pattern.push(currentSet.C);
            }

            // 빈칸 위치 (마지막 혹은 중간 랜덤)
            // 여기선 학습 편의를 위해 뒤쪽(7, 8, 9번 중 하나)을 빈칸으로
            missingIndex = Math.floor(Math.random() * 3) + 6; 
            correctAnswer = pattern[missingIndex];

            // 화면 그리기
            pattern.forEach((char, index) => {
                const div = document.createElement('div');
                div.className = 'pattern-item';
                
                if (index === missingIndex) {
                    div.classList.add('empty');
                    div.innerText = "?";
                    div.id = 'targetSlot';
                } else {
                    div.innerText = char;
                }
                row.appendChild(div);
            });

            // 보기 생성 (A, B, C)
            const choices = [currentSet.A, currentSet.B, currentSet.C].sort(() => Math.random() - 0.5);
            
            choices.forEach(char => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = char;
                btn.onclick = () => checkAnswer(btn, char);
                opts.appendChild(btn);
            });
        }

        function checkAnswer(btn, selected) {
            const slot = document.getElementById('targetSlot');
            
            if (selected === correctAnswer) {
                slot.innerText = selected;
                slot.classList.remove('empty');
                slot.classList.add('filled');
                
                playSuccess();
                
                setTimeout(() => {
                    alert("참 잘했어요! 규칙 박사님이네요! 🎓");
                    initGame();
                }, 500);
            } else {
                btn.classList.add('wrong');
                playWrong();
                setTimeout(() => btn.classList.remove('wrong'), 400);
            }
        }

        function playSuccess() {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.frequency.setValueAtTime(600, ctx.currentTime);
            osc.frequency.setValueAtTime(800, ctx.currentTime + 0.1);
            osc.frequency.setValueAtTime(1000, ctx.currentTime + 0.2);
            gain.gain.setValueAtTime(0.1, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4);
            osc.start();
            osc.stop(ctx.currentTime + 0.4);
        }

        function playWrong() {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(150, ctx.currentTime);
            gain.gain.setValueAtTime(0.1, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.2);
            osc.start();
            osc.stop(ctx.currentTime + 0.2);
        }

        initGame();
    </script>
</body>
</html>
