<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>무게 비교하기</title>
    <style>
        /* [선생님 수정 포인트 1] 디자인 */
        :root {
            --bg-color: #f0f9ff;
            --balance-color: #475569;   /* 저울 색상 */
            --plate-color: #cbd5e1;     /* 접시 색상 */
        }

        body {
            font-family: 'Malgun Gothic', sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            user-select: none;
        }

        h1 { color: #0f172a; margin-bottom: 10px; }

        .question {
            background: white;
            padding: 10px 30px;
            border-radius: 50px;
            font-size: 1.5rem;
            font-weight: bold;
            color: #0369a1;
            margin-bottom: 40px;
            border: 2px solid #bae6fd;
        }

        /* 저울 전체 컨테이너 */
        .scale-container {
            width: 100%;
            max-width: 600px;
            height: 300px;
            position: relative;
            display: flex;
            justify-content: center;
            margin-bottom: 50px;
        }

        /* 저울 기둥 */
        .scale-base {
            position: absolute;
            bottom: 0;
            width: 20px;
            height: 150px;
            background: var(--balance-color);
            border-radius: 10px 10px 0 0;
        }
        
        .scale-foot {
            position: absolute;
            bottom: 0;
            width: 100px;
            height: 20px;
            background: var(--balance-color);
            border-radius: 10px;
        }

        /* 저울 팔 (회전하는 부분) */
        .scale-arm-wrapper {
            position: absolute;
            top: 150px; /* 기둥 높이 */
            width: 500px;
            height: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 1s cubic-bezier(0.34, 1.56, 0.64, 1); /* 튕기는 효과 */
            transform-origin: center;
        }

        .scale-arm {
            width: 100%;
            height: 10px;
            background: var(--balance-color);
            border-radius: 5px;
            position: relative;
        }

        /* 접시 줄 */
        .string-left, .string-right {
            position: absolute;
            top: 5px;
            width: 2px;
            height: 80px;
            background: #94a3b8;
        }
        .string-left { left: 20px; }
        .string-right { right: 20px; }

        /* 접시 */
        .plate {
            position: absolute;
            top: 80px;
            width: 100px;
            height: 20px;
            background: var(--plate-color);
            border-radius: 0 0 50px 50px;
            border: 2px solid #94a3b8;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .plate-left { left: -30px; } /* string 기준 위치 조정 */
        .plate-right { right: -30px; }

        .plate:hover { background-color: #e2e8f0; }
        
        .plate.correct { background-color: #22c55e; }
        .plate.wrong { background-color: #ef4444; }

        /* 물건 아이템 */
        .item-on-plate {
            position: absolute;
            bottom: 20px; /* 접시 위 */
            left: 50%;
            transform: translateX(-50%);
            font-size: 4rem;
            transition: transform 1s; /* 회전 시 반대로 돌려서 수직 유지 */
        }

        .controls { margin-top: 20px; }
        button {
            padding: 10px 25px;
            font-size: 1.2rem;
            border-radius: 10px;
            border: none;
            background: #0ea5e9;
            color: white;
            cursor: pointer;
        }

    </style>
</head>
<body>

    <h1>⚖️ 무게 비교하기 <span style="font-size:0.5em; color:#888; border:1px solid #ddd; padding:2px 5px; border-radius:5px; vertical-align:middle;">[2수학03-02] 무게 비교 (무겁다/가볍다)</span></h1>
    <div class="question" id="qText">더 무거운 것은?</div>

    <div class="scale-container">
        <div class="scale-base"></div>
        <div class="scale-foot"></div>
        
        <div class="scale-arm-wrapper" id="scaleArm">
            <div class="scale-arm">
                <!-- 왼쪽 접시 세트 -->
                <div class="string-left">
                    <div class="plate plate-left" onclick="checkAnswer('left')">
                        <div class="item-on-plate" id="itemLeft">🐘</div>
                    </div>
                </div>
                
                <!-- 오른쪽 접시 세트 -->
                <div class="string-right">
                    <div class="plate plate-right" onclick="checkAnswer('right')">
                        <div class="item-on-plate" id="itemRight">🐜</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="controls">
        <button onclick="nextProblem()">다음 문제 ➡️</button>
    </div>

    <script>
        /* [선생님 수정 포인트 2] 물건 무게 데이터 (임의의 점수) */
        // 점수가 클수록 무거움 -> 저울이 내려감
        const items = [
            { icon: "🐘", weight: 100, name: "코끼리" },
            { icon: "🐜", weight: 1, name: "개미" },
            { icon: "🚙", weight: 80, name: "자동차" },
            { icon: "🚲", weight: 30, name: "자전거" },
            { icon: "🍉", weight: 10, name: "수박" },
            { icon: "✏️", weight: 0.5, name: "연필" },
            { icon: "🐱", weight: 20, name: "고양이" },
            { icon: "🐥", weight: 5, name: "병아리" }
        ];

        let currentMode = "heavy"; // "heavy" (무거운) or "light" (가벼운)
        let w1 = 0, w2 = 0;

        function initGame() {
            nextProblem();
        }

        function nextProblem() {
            // 모드 설정
            currentMode = Math.random() > 0.5 ? "heavy" : "light";
            document.getElementById('qText').innerText = 
                currentMode === "heavy" ? "더 무거운 것은? (아래로 내려간 것)" : "더 가벼운 것은? (위로 올라간 것)";

            // 물건 2개 랜덤 선택 (무게 차이 나게)
            let idx1 = Math.floor(Math.random() * items.length);
            let idx2;
            do {
                idx2 = Math.floor(Math.random() * items.length);
            } while (idx1 === idx2);

            const item1 = items[idx1];
            const item2 = items[idx2];
            w1 = item1.weight;
            w2 = item2.weight;

            // 아이템 배치
            document.getElementById('itemLeft').innerText = item1.icon;
            document.getElementById('itemRight').innerText = item2.icon;

            // 저울 기울기 계산 (최대 20도)
            const arm = document.getElementById('scaleArm');
            const leftItems = document.getElementById('itemLeft');
            const rightItems = document.getElementById('itemRight');

            let angle = 0;
            if (w1 > w2) angle = -15; // 왼쪽이 무거움 -> 반시계 회전 (왼쪽 내려감)
            else if (w2 > w1) angle = 15; // 오른쪽이 무거움 -> 시계 회전 (오른쪽 내려감)

            // 저울 회전 적용
            arm.style.transform = `rotate(${angle}deg)`;

            // 아이템 역회전 (수직 유지)
            leftItems.style.transform = `translateX(-50%) rotate(${-angle}deg)`;
            rightItems.style.transform = `translateX(-50%) rotate(${-angle}deg)`;
            
            // 접시 색 초기화
            document.querySelectorAll('.plate').forEach(p => p.className = p.className.replace('correct', '').replace('wrong', ''));
        }

        function checkAnswer(side) {
            const plateLeft = document.querySelector('.plate-left');
            const plateRight = document.querySelector('.plate-right');
            
            // 정답 판단
            let isCorrect = false;
            if (currentMode === "heavy") {
                if (side === 'left' && w1 > w2) isCorrect = true;
                if (side === 'right' && w2 > w1) isCorrect = true;
            } else {
                if (side === 'left' && w1 < w2) isCorrect = true;
                if (side === 'right' && w2 < w1) isCorrect = true;
            }

            if (isCorrect) {
                // 정답
                if(side === 'left') plateLeft.classList.add('correct');
                else plateRight.classList.add('correct');
                playSuccess();
                setTimeout(nextProblem, 1500);
            } else {
                // 오답
                if(side === 'left') plateLeft.classList.add('wrong');
                else plateRight.classList.add('wrong');
                playWrong();
            }
        }

        function playSuccess() {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.frequency.setValueAtTime(523.25, ctx.currentTime); // 도
            osc.frequency.setValueAtTime(783.99, ctx.currentTime + 0.1); // 솔
            gain.gain.setValueAtTime(0.1, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
            osc.start();
            osc.stop(ctx.currentTime + 0.3);
        }

        function playWrong() {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(100, ctx.currentTime);
            gain.gain.setValueAtTime(0.1, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.2);
            osc.start();
            osc.stop(ctx.currentTime + 0.2);
        }

        initGame();
    </script>
</body>
</html>
