<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>생활 속 도형 찾기</title>
    <style>
        /* [선생님 수정 포인트 1] 스타일 */
        :root {
            --bg-color: #f5f5f4;
            --target-color: #facc15; /* 찾는 도형 강조색 */
        }

        body {
            font-family: 'Malgun Gothic', sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            user-select: none;
        }

        h1 { color: #44403c; margin-bottom: 10px; }

        .mission-box {
            background: white;
            padding: 15px 30px;
            border-radius: 50px;
            font-size: 1.5rem;
            font-weight: bold;
            color: #ea580c;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .mission-icon {
            font-size: 2rem;
            background: #ffedd5;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .scene-container {
            position: relative;
            width: 100%;
            max-width: 800px;
            aspect-ratio: 4/3;
            background-color: #d6d3d1; /* 이미지 로딩 전 배경색 */
            background-size: cover;
            background-position: center;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            overflow: hidden;
            cursor: crosshair;
        }
        
        /* 실제 이미지 로딩용 */
        .bg-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* 숨은 도형 (투명 버튼 역할) */
        .hidden-spot {
            position: absolute;
            border: 3px solid transparent; /* 평소엔 안 보임 */
            border-radius: 50%; /* 기본 원형 */
            cursor: pointer;
            transition: all 0.3s;
        }

        /* 찾았을 때 스타일 */
        .hidden-spot.found {
            border-color: #22c55e;
            background-color: rgba(34, 197, 94, 0.3);
            box-shadow: 0 0 15px #22c55e;
            animation: pulse 1s infinite;
        }

        .feedback {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            font-size: 5rem;
            color: #22c55e;
            opacity: 0;
            pointer-events: none;
            text-shadow: 0 0 10px white;
        }
        
        .feedback.show {
            animation: popUp 0.8s forwards;
        }

        .controls { margin-top: 20px; }

        button {
            padding: 12px 25px;
            font-size: 1.2rem;
            border-radius: 10px;
            border: none;
            background: #ea580c;
            color: white;
            cursor: pointer;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
        
        @keyframes popUp {
            0% { opacity: 0; transform: translate(-50%, -50%) scale(0.5); }
            50% { opacity: 1; transform: translate(-50%, -50%) scale(1.2); }
            100% { opacity: 0; transform: translate(-50%, -50%) scale(1); }
        }
    </style>
</head>
<body>

    <h1>🕵️‍♀️ 숨은 도형 찾기 <span style="font-size:0.5em; color:#888; border:1px solid #ddd; padding:2px 5px; border-radius:5px; vertical-align:middle;">[2수학02-01] 생활 속 도형 찾기</span></h1>
    
    <div class="mission-box">
        <span class="mission-icon" id="targetIcon">🔴</span>
        <span id="targetName">동그라미</span>를 모두 찾아보세요! (<span id="foundCount">0</span>/<span id="totalCount">0</span>)
    </div>

    <div class="scene-container" id="scene">
        <!-- 배경 이미지는 CSS나 img 태그로 처리 -->
        <!-- [선생님 수정 포인트 2] 배경 이미지 URL (교실, 방 사진 등) -->
        <img src="https://images.unsplash.com/photo-1503676260728-1c00da094a0b?q=80&w=1000&auto=format&fit=crop" class="bg-image" alt="교실 배경">
        
        <div class="feedback" id="feedbackIcon">⭕</div>
    </div>

    <div class="controls">
        <button onclick="resetGame()">다시 찾기 🔄</button>
    </div>

    <script>
        /* [선생님 수정 포인트 3] 숨은 도형 위치 설정 */
        // top, left: 위치 (%), width, height: 크기 (%), type: 도형 종류
        // 선생님이 사진을 바꾸면, 이 좌표값들을 수정해서 물건 위치에 맞춰야 합니다.
        const spots = [
            { top: 25, left: 10, width: 10, height: 13, type: "square", name: "액자" }, // 예시 위치
            { top: 60, left: 45, width: 8, height: 10, type: "circle", name: "시계" }, 
            { top: 80, left: 70, width: 12, height: 16, type: "square", name: "책" },
            { top: 40, left: 85, width: 9, height: 12, type: "circle", name: "공" },
            { top: 15, left: 50, width: 15, height: 20, type: "triangle", name: "깃발" }
        ];

        // 이번 게임의 목표 도형
        let targetType = "circle";
        let targetName = "동그라미";
        let targetIcon = "🔴";
        let found = 0;
        let total = 0;

        function initGame() {
            // 랜덤 미션 설정
            const types = [
                { type: "circle", name: "동그라미", icon: "🔴" },
                { type: "square", name: "네모", icon: "🟥" }
                // 세모는 사진에 없을 수 있으니 일단 제외하거나 추가 가능
            ];
            const mission = types[Math.floor(Math.random() * types.length)];
            
            targetType = mission.type;
            targetName = mission.name;
            targetIcon = mission.icon;

            document.getElementById('targetIcon').innerText = targetIcon;
            document.getElementById('targetName').innerText = targetName;

            found = 0;
            total = spots.filter(s => s.type === targetType).length;
            
            document.getElementById('foundCount').innerText = found;
            document.getElementById('totalCount').innerText = total;

            drawSpots();
        }

        function drawSpots() {
            const scene = document.getElementById('scene');
            // 기존 스팟 제거 (이미지랑 피드백 제외)
            document.querySelectorAll('.hidden-spot').forEach(e => e.remove());

            spots.forEach((spot, index) => {
                if (spot.type !== targetType) return; // 목표 도형만 생성 (혹은 다 생성하고 클릭 시 오답 처리도 가능)

                const div = document.createElement('div');
                div.className = 'hidden-spot';
                div.style.top = spot.top + '%';
                div.style.left = spot.left + '%';
                div.style.width = spot.width + '%';
                div.style.height = spot.height + '%';
                
                // 네모/동그라미 모양 적용
                if(spot.type === 'circle') div.style.borderRadius = '50%';
                else div.style.borderRadius = '5px';

                div.onclick = (e) => handleFound(e, div);
                scene.appendChild(div);
            });
        }

        function handleFound(e, element) {
            e.stopPropagation(); // 배경 클릭 방지
            if(element.classList.contains('found')) return;

            element.classList.add('found');
            found++;
            document.getElementById('foundCount').innerText = found;
            
            showFeedback();
            playSuccess();

            if(found === total) {
                setTimeout(() => alert("모두 찾았어요! 눈이 정말 밝네요! 👁️✨"), 500);
            }
        }
        
        function showFeedback() {
            const fb = document.getElementById('feedbackIcon');
            fb.classList.remove('show');
            void fb.offsetWidth; // 리플로우 강제
            fb.classList.add('show');
        }

        function playSuccess() {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.frequency.setValueAtTime(800, ctx.currentTime);
            gain.gain.setValueAtTime(0.1, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.2);
            osc.start();
            osc.stop(ctx.currentTime + 0.2);
        }

        initGame();
    </script>
</body>
</html>
