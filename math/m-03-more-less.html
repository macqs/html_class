<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>많다 적다 비교하기</title>
    <style>
        /* [선생님 수정 포인트 1] 색상 테마 */
        :root {
            --bg-color: #e0f2fe;        /* 배경색 (연한 하늘색) */
            --card-bg: #ffffff;         /* 카드 배경 */
            --highlight: #0ea5e9;       /* 강조색 */
            --text-color: #0c4a6e;      /* 글자색 */
        }

        body {
            font-family: 'Malgun Gothic', sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            user-select: none;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 {
            color: var(--text-color);
            font-size: 2rem;
            margin: 0;
        }

        .question {
            background: white;
            padding: 10px 30px;
            border-radius: 50px;
            margin-top: 20px;
            font-size: 1.8rem;
            font-weight: bold;
            color: #0284c7;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            border: 2px solid #bae6fd;
        }

        .comparison-area {
            display: flex;
            gap: 30px;
            margin-top: 30px;
            width: 100%;
            max-width: 800px;
            justify-content: center;
        }

        .group-card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 20px;
            width: 45%;
            min-height: 300px;
            display: flex;
            flex-wrap: wrap;
            align-content: center;
            justify-content: center;
            gap: 10px;
            cursor: pointer;
            border: 5px solid transparent;
            transition: all 0.3s;
            box-shadow: 0 10px 15px rgba(0,0,0,0.05);
        }

        .group-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 25px rgba(0,0,0,0.1);
            border-color: #7dd3fc;
        }

        .group-card.correct {
            border-color: #22c55e;
            background-color: #f0fdf4;
            animation: bounce 0.5s;
        }

        .group-card.wrong {
            border-color: #ef4444;
            background-color: #fef2f2;
            animation: shake 0.4s;
        }

        .item {
            font-size: 3.5rem;
        }

        .controls {
            margin-top: 40px;
        }

        button {
            background-color: var(--highlight);
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 1.2rem;
            border-radius: 10px;
            cursor: pointer;
        }
        
        button:hover { background-color: #0284c7; }

        @keyframes bounce {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        @media (max-width: 600px) {
            .comparison-area {
                flex-direction: column;
                align-items: center;
            }
            .group-card {
                width: 80%;
            }
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>⚖️ 어느 쪽이 더 많을까요? <span style="font-size:0.5em; color:#888; border:1px solid #ddd; padding:2px 5px; border-radius:5px; vertical-align:middle;">[2수학01-03] 양 비교 (많다/적다)</span></h1>
        <div class="question" id="questionText">더 많은 쪽을 찾아보세요!</div>
    </div>

    <div class="comparison-area">
        <div class="group-card" id="leftCard" onclick="checkAnswer('left')">
            <!-- 왼쪽 물건들 -->
        </div>
        <div class="group-card" id="rightCard" onclick="checkAnswer('right')">
            <!-- 오른쪽 물건들 -->
        </div>
    </div>

    <div class="controls">
        <button onclick="nextProblem()">다음 문제 ➡️</button>
    </div>

    <script>
        /* [선생님 수정 포인트 2] 물건 이모지 목록 */
        const items = ["🍪", "🍬", "🍊", "🍓", "⚽", "🎈", "🐤"];
        
        let currentMode = "more"; // "more" (많은 것) 또는 "less" (적은 것)
        let leftCount = 0;
        let rightCount = 0;

        function initGame() {
            nextProblem();
        }

        function nextProblem() {
            // 모드 랜덤 설정 (많은 것 찾기 vs 적은 것 찾기)
            currentMode = Math.random() > 0.5 ? "more" : "less";
            document.getElementById('questionText').innerText = 
                currentMode === "more" ? "더 많은 쪽을 찾아보세요! (많다)" : "더 적은 쪽을 찾아보세요! (적다)";
            
            // 카드 초기화
            resetCard(document.getElementById('leftCard'));
            resetCard(document.getElementById('rightCard'));

            // 개수 랜덤 설정 (1~9, 서로 다르게)
            leftCount = Math.floor(Math.random() * 9) + 1;
            do {
                rightCount = Math.floor(Math.random() * 9) + 1;
            } while (leftCount === rightCount);

            // 아이템 랜덤 선택
            const item = items[Math.floor(Math.random() * items.length)];

            // 화면에 그리기
            drawItems('leftCard', leftCount, item);
            drawItems('rightCard', rightCount, item);
        }

        function drawItems(cardId, count, item) {
            const card = document.getElementById(cardId);
            card.innerHTML = '';
            for(let i=0; i<count; i++) {
                const span = document.createElement('span');
                span.className = 'item';
                span.innerText = item;
                card.appendChild(span);
            }
        }

        function resetCard(card) {
            card.className = 'group-card';
            card.style.pointerEvents = 'auto';
        }

        function checkAnswer(side) {
            const leftCard = document.getElementById('leftCard');
            const rightCard = document.getElementById('rightCard');
            
            let isCorrect = false;
            if (currentMode === "more") {
                // 많은 것 찾기
                if (side === 'left' && leftCount > rightCount) isCorrect = true;
                if (side === 'right' && rightCount > leftCount) isCorrect = true;
            } else {
                // 적은 것 찾기
                if (side === 'left' && leftCount < rightCount) isCorrect = true;
                if (side === 'right' && rightCount < leftCount) isCorrect = true;
            }

            if (isCorrect) {
                // 정답
                if (side === 'left') leftCard.classList.add('correct');
                else rightCard.classList.add('correct');
                
                playSuccess();
                
                // 정답 맞히면 클릭 방지
                leftCard.style.pointerEvents = 'none';
                rightCard.style.pointerEvents = 'none';
                
                setTimeout(nextProblem, 1500);
            } else {
                // 오답
                if (side === 'left') leftCard.classList.add('wrong');
                else rightCard.classList.add('wrong');
                
                playWrong();
                
                // 0.5초 뒤에 오답 표시 제거
                setTimeout(() => {
                    leftCard.classList.remove('wrong');
                    rightCard.classList.remove('wrong');
                }, 500);
            }
        }

        function playSuccess() {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.frequency.setValueAtTime(600, ctx.currentTime);
            osc.frequency.setValueAtTime(800, ctx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.1, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.2);
            osc.start();
            osc.stop(ctx.currentTime + 0.2);
        }

        function playWrong() {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(200, ctx.currentTime);
            osc.frequency.linearRampToValueAtTime(100, ctx.currentTime + 0.2);
            gain.gain.setValueAtTime(0.1, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.2);
            osc.start();
            osc.stop(ctx.currentTime + 0.2);
        }

        initGame();
    </script>
</body>
</html>
