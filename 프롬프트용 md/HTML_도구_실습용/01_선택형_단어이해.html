<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>국어과 단어 이해 학습 도구</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 800px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        
        .header {
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 3px solid #667eea;
        }
        
        .header h1 {
            color: #333;
            font-size: 32px;
            margin-bottom: 10px;
        }
        
        .achievement {
            background: #f0f4ff;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            border-left: 4px solid #667eea;
        }
        
        .achievement-code {
            font-weight: bold;
            color: #667eea;
            font-size: 18px;
        }
        
        .achievement-content {
            color: #666;
            font-size: 15px;
            margin-top: 8px;
            line-height: 1.5;
        }
        
        .question {
            background: #fff9e6;
            padding: 25px;
            border-radius: 10px;
            margin-bottom: 30px;
            font-size: 24px;
            font-weight: bold;
            color: #333;
            text-align: center;
            border: 3px solid #ffd700;
        }
        
        .options {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .option {
            background: #f8f9fa;
            border: 3px solid #ddd;
            border-radius: 15px;
            padding: 30px;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
            font-size: 20px;
            font-weight: 600;
            min-height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .option:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 15px rgba(0,0,0,0.2);
        }
        
        .option.selected {
            background: #667eea;
            color: white;
            border-color: #667eea;
            transform: scale(1.05);
        }
        
        .buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }
        
        button {
            padding: 18px 45px;
            font-size: 20px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: bold;
        }
        
        .check-btn {
            background: #4CAF50;
            color: white;
        }
        
        .check-btn:hover {
            background: #45a049;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(76, 175, 80, 0.4);
        }
        
        .reset-btn {
            background: #ff9800;
            color: white;
        }
        
        .reset-btn:hover {
            background: #e68900;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(255, 152, 0, 0.4);
        }
        
        .feedback {
            margin-top: 25px;
            padding: 25px;
            border-radius: 12px;
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            display: none;
        }
        
        .feedback.correct {
            background: #d4edda;
            color: #155724;
            border: 3px solid #28a745;
            display: block;
            animation: slideIn 0.3s ease;
        }
        
        .feedback.incorrect {
            background: #f8d7da;
            color: #721c24;
            border: 3px solid #dc3545;
            display: block;
            animation: shake 0.5s;
        }
        
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }
        
        .score {
            text-align: center;
            font-size: 20px;
            color: #666;
            margin-top: 20px;
            font-weight: 600;
        }
        
        /* 접근성: 큰 터치 영역 */
        @media (max-width: 600px) {
            .option {
                padding: 35px;
                font-size: 22px;
            }
            
            button {
                padding: 20px 40px;
                font-size: 22px;
            }
        }
        
        /* 키보드 포커스 스타일 */
        .option:focus, button:focus {
            outline: 4px solid #ffd700;
            outline-offset: 3px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📚 국어과 학습 도구</h1>
        </div>
        
        <div class="achievement">
            <div class="achievement-code">[2국어02-02] 성취기준</div>
            <div class="achievement-content">여러 가지 모양 중에서 글자의 기초가 되는 형태의 그림이나 모양을 찾고 변별하는 능력을 기릅니다</div>
        </div>
        
        <div class="question" id="question">
            <!-- 💡 수정 포인트 1: 질문 내용 -->
            다음 중 동그라미 모양을 찾으세요
        </div>
        
        <div class="options" id="options">
            <!-- 💡 수정 포인트 2: 선택지 (정답은 data-correct="true") -->
            <div class="option" data-correct="false" tabindex="0">⬜ 네모</div>
            <div class="option" data-correct="true" tabindex="0">⚪ 동그라미</div>
            <div class="option" data-correct="false" tabindex="0">🔺 세모</div>
            <div class="option" data-correct="false" tabindex="0">⭐ 별</div>
        </div>
        
        <div class="buttons">
            <button class="check-btn" onclick="checkAnswer()">✓ 정답 확인</button>
            <button class="reset-btn" onclick="resetQuiz()">↻ 다시하기</button>
        </div>
        
        <div class="feedback" id="feedback"></div>
        <div class="score" id="score">시도 횟수: 0</div>
    </div>

    <script>
        let attempts = 0;
        let selectedOption = null;
        
        // 선택지 클릭 이벤트
        document.querySelectorAll('.option').forEach(option => {
            option.addEventListener('click', function() {
                // 이전 선택 제거
                document.querySelectorAll('.option').forEach(opt => {
                    opt.classList.remove('selected');
                });
                
                // 현재 선택
                this.classList.add('selected');
                selectedOption = this;
            });
            
            // 키보드 접근성
            option.addEventListener('keypress', function(e) {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    this.click();
                }
            });
        });
        
        function checkAnswer() {
            if (!selectedOption) {
                alert('선택지를 먼저 선택해주세요!');
                return;
            }
            
            attempts++;
            document.getElementById('score').textContent = `시도 횟수: ${attempts}`;
            
            const feedback = document.getElementById('feedback');
            const isCorrect = selectedOption.dataset.correct === 'true';
            
            if (isCorrect) {
                feedback.textContent = '🎉 정답입니다! 잘했어요!';
                feedback.className = 'feedback correct';
                
                // 정답 효과음 (선택사항)
                if ('speechSynthesis' in window) {
                    const utterance = new SpeechSynthesisUtterance('정답입니다');
                    utterance.lang = 'ko-KR';
                    speechSynthesis.speak(utterance);
                }
            } else {
                feedback.textContent = '❌ 다시 한번 생각해보세요!';
                feedback.className = 'feedback incorrect';
            }
        }
        
        function resetQuiz() {
            selectedOption = null;
            attempts = 0;
            
            document.querySelectorAll('.option').forEach(opt => {
                opt.classList.remove('selected');
            });
            
            document.getElementById('feedback').style.display = 'none';
            document.getElementById('feedback').className = 'feedback';
            document.getElementById('score').textContent = '시도 횟수: 0';
        }
    </script>
</body>
</html>
