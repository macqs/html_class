<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>국어과 학습 도구 - 9국어02-05</title>
    <style>
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Malgun Gothic', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 3px solid #667eea;
        }
        .header h1 { color: #333; font-size: 28px; }
        .achievement {
            background: #f0f4ff;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            border-left: 4px solid #667eea;
        }
        .achievement-code { font-weight: bold; color: #667eea; font-size: 16px; }
        .achievement-content { color: #666; font-size: 14px; margin-top: 5px; }
        button {
            padding: 15px 40px;
            font-size: 18px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }
        .check-btn { background: #4CAF50; color: white; }
        .check-btn:hover { background: #45a049; transform: translateY(-2px); }
        .reset-btn { background: #ff9800; color: white; }
        .reset-btn:hover { background: #e68900; transform: translateY(-2px); }
        .feedback {
            margin-top: 20px;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            display: none;
        }
        .feedback.show { display: block; }
        .feedback.correct { background: #d4edda; color: #155724; border: 2px solid #28a745; }
        .feedback.incorrect { background: #f8d7da; color: #721c24; border: 2px solid #dc3545; }
    
        
        .instruction { background: #fff9e6; padding: 15px; border-radius: 10px;
                      margin-bottom: 20px; text-align: center; font-size: 18px; }
        .items { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        .item { background: #f8f9fa; border: 3px solid #ddd; border-radius: 12px;
               padding: 15px; cursor: move; }
        .categories { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
                     gap: 20px; margin-bottom: 20px; }
        .category { background: #f8f9fa; padding: 15px; border-radius: 10px; }
        .category h3 { margin-bottom: 10px; text-align: center; }
        .drop-zone { min-height: 150px; border: 2px dashed #ddd; border-radius: 10px;
                    padding: 10px; display: flex; flex-direction: column; gap: 10px; }
        .buttons { display: flex; gap: 15px; justify-content: center; }
        
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📚 국어과 학습 도구</h1>
        </div>
        
        <div class="achievement">
            <div class="achievement-code">9국어02-05</div>
            <div class="achievement-content">글을 읽고 글에 대한 느낌과 경험을 다른 사람과 나눈다. (가) 성취기준 해설 •</div>
        </div>
        
        
        <div class="instruction">항목들을 올바른 카테고리로 분류하세요</div>
        <div class="items" id="items">
            <div class="item" data-category="A">항목 1</div>
            <div class="item" data-category="B">항목 2</div>
            <div class="item" data-category="A">항목 3</div>
        </div>
        <div class="categories">
            <div class="category" data-cat="A"><h3>카테고리 A</h3><div class="drop-zone"></div></div>
            <div class="category" data-cat="B"><h3>카테고리 B</h3><div class="drop-zone"></div></div>
        </div>
        <div class="buttons">
            <button class="check-btn" onclick="checkCategories()">분류 확인</button>
            <button class="reset-btn" onclick="reset()">다시하기</button>
        </div>
        <div class="feedback" id="feedback"></div>
        
    </div>

    <script>
        
        let dragged = null;
        document.querySelectorAll('.item').forEach(item => {
            item.draggable = true;
            item.addEventListener('dragstart', function() { dragged = this; });
        });
        document.querySelectorAll('.drop-zone').forEach(zone => {
            zone.addEventListener('dragover', e => e.preventDefault());
            zone.addEventListener('drop', function() { this.appendChild(dragged); });
        });
        function checkCategories() {
            let correct = true;
            document.querySelectorAll('.category').forEach(cat => {
                const items = cat.querySelectorAll('.item');
                items.forEach(item => {
                    if (item.dataset.category !== cat.dataset.cat) correct = false;
                });
            });
            const feedback = document.getElementById('feedback');
            if (correct) {
                feedback.textContent = '🎉 모두 맞게 분류했습니다!';
                feedback.className = 'feedback correct show';
            } else {
                feedback.textContent = '❌ 분류를 다시 확인하세요!';
                feedback.className = 'feedback incorrect show';
            }
        }
        function reset() {
            const itemsContainer = document.getElementById('items');
            document.querySelectorAll('.drop-zone .item').forEach(item => {
                itemsContainer.appendChild(item);
            });
            document.getElementById('feedback').className = 'feedback';
        }
        
    </script>
</body>
</html>
