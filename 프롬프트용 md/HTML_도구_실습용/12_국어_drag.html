<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>국어과 학습 도구 - 9국어01-01</title>
    <style>
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Malgun Gothic', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 3px solid #667eea;
        }
        .header h1 { color: #333; font-size: 28px; }
        .achievement {
            background: #f0f4ff;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            border-left: 4px solid #667eea;
        }
        .achievement-code { font-weight: bold; color: #667eea; font-size: 16px; }
        .achievement-content { color: #666; font-size: 14px; margin-top: 5px; }
        button {
            padding: 15px 40px;
            font-size: 18px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }
        .check-btn { background: #4CAF50; color: white; }
        .check-btn:hover { background: #45a049; transform: translateY(-2px); }
        .reset-btn { background: #ff9800; color: white; }
        .reset-btn:hover { background: #e68900; transform: translateY(-2px); }
        .feedback {
            margin-top: 20px;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            display: none;
        }
        .feedback.show { display: block; }
        .feedback.correct { background: #d4edda; color: #155724; border: 2px solid #28a745; }
        .feedback.incorrect { background: #f8d7da; color: #721c24; border: 2px solid #dc3545; }
    
        
        .instruction { background: #fff9e6; padding: 15px; border-radius: 10px;
                      margin-bottom: 20px; text-align: center; font-size: 18px; }
        .items { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
        .item { background: #f8f9fa; border: 3px solid #ddd; border-radius: 12px;
               padding: 20px; cursor: move; text-align: center; font-size: 18px; }
        .item:hover { transform: translateY(-2px); }
        .item.dragging { opacity: 0.5; }
        .buttons { display: flex; gap: 15px; justify-content: center; }
        
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📚 국어과 학습 도구</h1>
        </div>
        
        <div class="achievement">
            <div class="achievement-code">9국어01-01</div>
            <div class="achievement-content">이 성취기준은 일상적인 대화 장면에서 상대방의 이야기를 듣고 주요 내용을 파악하여 적절히 활용하는 능력을 기...</div>
        </div>
        
        
        <div class="instruction">항목을 드래그해서 올바른 순서로 배열하세요</div>
        <div class="items" id="items">
            <div class="item" draggable="true" data-order="1">첫 번째</div>
            <div class="item" draggable="true" data-order="2">두 번째</div>
            <div class="item" draggable="true" data-order="3">세 번째</div>
        </div>
        <div class="buttons">
            <button class="check-btn" onclick="checkOrder()">순서 확인</button>
            <button class="reset-btn" onclick="shuffle()">섞기</button>
        </div>
        <div class="feedback" id="feedback"></div>
        
    </div>

    <script>
        
        let dragged = null;
        document.querySelectorAll('.item').forEach(item => {
            item.addEventListener('dragstart', function() { dragged = this; });
            item.addEventListener('dragover', function(e) { e.preventDefault(); });
            item.addEventListener('drop', function(e) {
                e.preventDefault();
                if (this !== dragged) {
                    const items = [...document.querySelectorAll('.item')];
                    const draggedIdx = items.indexOf(dragged);
                    const droppedIdx = items.indexOf(this);
                    if (draggedIdx < droppedIdx) {
                        this.parentNode.insertBefore(dragged, this.nextSibling);
                    } else {
                        this.parentNode.insertBefore(dragged, this);
                    }
                }
            });
        });
        function checkOrder() {
            const items = [...document.querySelectorAll('.item')];
            const isCorrect = items.every((item, idx) => item.dataset.order == (idx + 1));
            const feedback = document.getElementById('feedback');
            if (isCorrect) {
                feedback.textContent = '🎉 순서가 맞습니다!';
                feedback.className = 'feedback correct show';
            } else {
                feedback.textContent = '❌ 순서를 다시 확인하세요!';
                feedback.className = 'feedback incorrect show';
            }
        }
        function shuffle() {
            const container = document.getElementById('items');
            const items = [...container.querySelectorAll('.item')];
            items.sort(() => Math.random() - 0.5);
            items.forEach(item => container.appendChild(item));
            document.getElementById('feedback').className = 'feedback';
        }
        
    </script>
</body>
</html>
