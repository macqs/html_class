<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>사회과 학습 도구 - 4사회03-02</title>
    <style>
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Malgun Gothic', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 3px solid #667eea;
        }
        .header h1 { color: #333; font-size: 28px; }
        .achievement {
            background: #f0f4ff;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            border-left: 4px solid #667eea;
        }
        .achievement-code { font-weight: bold; color: #667eea; font-size: 16px; }
        .achievement-content { color: #666; font-size: 14px; margin-top: 5px; }
        button {
            padding: 15px 40px;
            font-size: 18px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }
        .check-btn { background: #4CAF50; color: white; }
        .check-btn:hover { background: #45a049; transform: translateY(-2px); }
        .reset-btn { background: #ff9800; color: white; }
        .reset-btn:hover { background: #e68900; transform: translateY(-2px); }
        .feedback {
            margin-top: 20px;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            display: none;
        }
        .feedback.show { display: block; }
        .feedback.correct { background: #d4edda; color: #155724; border: 2px solid #28a745; }
        .feedback.incorrect { background: #f8d7da; color: #721c24; border: 2px solid #dc3545; }
    
        
        .instruction { background: #fff9e6; padding: 15px; border-radius: 10px;
                      margin-bottom: 20px; text-align: center; font-size: 18px; }
        .matching { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
        .column { display: flex; flex-direction: column; gap: 10px; }
        .item { background: #f8f9fa; border: 3px solid #ddd; border-radius: 12px;
               padding: 20px; cursor: pointer; text-align: center; }
        .item:hover { transform: translateY(-2px); }
        .item.selected { background: #667eea; color: white; }
        .item.matched { background: #4CAF50; color: white; cursor: not-allowed; }
        .buttons { display: flex; gap: 15px; justify-content: center; }
        
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📚 사회과 학습 도구</h1>
        </div>
        
        <div class="achievement">
            <div class="achievement-code">4사회03-02</div>
            <div class="achievement-content">이 성취기준은 나의 생활과 이웃의 일 혹은 직업과의 연관성을 살펴보고 주 사회 109 변 사람들의 경제활동에...</div>
        </div>
        
        
        <div class="instruction">왼쪽과 오른쪽에서 관련있는 것을 선택하세요</div>
        <div class="matching">
            <div class="column">
                <div class="item left" data-pair="1">항목 1</div>
                <div class="item left" data-pair="2">항목 2</div>
                <div class="item left" data-pair="3">항목 3</div>
            </div>
            <div class="column">
                <div class="item right" data-pair="1">항목 A</div>
                <div class="item right" data-pair="2">항목 B</div>
                <div class="item right" data-pair="3">항목 C</div>
            </div>
        </div>
        <div class="buttons">
            <button class="check-btn" onclick="checkMatch()">짝 확인</button>
            <button class="reset-btn" onclick="reset()">다시하기</button>
        </div>
        <div class="feedback" id="feedback"></div>
        
    </div>

    <script>
        
        let left = null, right = null;
        document.querySelectorAll('.item').forEach(item => {
            item.addEventListener('click', function() {
                if (this.classList.contains('matched')) return;
                if (this.classList.contains('left')) {
                    document.querySelectorAll('.left').forEach(i => i.classList.remove('selected'));
                    this.classList.add('selected');
                    left = this;
                } else {
                    document.querySelectorAll('.right').forEach(i => i.classList.remove('selected'));
                    this.classList.add('selected');
                    right = this;
                }
            });
        });
        function checkMatch() {
            if (!left || !right) { alert('양쪽에서 선택하세요!'); return; }
            const feedback = document.getElementById('feedback');
            if (left.dataset.pair === right.dataset.pair) {
                left.classList.add('matched');
                right.classList.add('matched');
                left.classList.remove('selected');
                right.classList.remove('selected');
                feedback.textContent = '✅ 맞았습니다!';
                feedback.className = 'feedback correct show';
                left = right = null;
            } else {
                feedback.textContent = '❌ 다시 선택하세요!';
                feedback.className = 'feedback incorrect show';
            }
        }
        function reset() {
            left = right = null;
            document.querySelectorAll('.item').forEach(i => {
                i.classList.remove('selected', 'matched');
            });
            document.getElementById('feedback').className = 'feedback';
        }
        
    </script>
</body>
</html>
